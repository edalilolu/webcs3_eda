<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reg Form</title>
</head>
<body>
    <h3>STUDENT REGISTRATION FORM</h3>
    <br><br>
    <form action="" method="POST">
        <label>FIRST NAME </label>
        <input type="text" name="fname" maxlength="32" placeholder=" " autofocus required> <br> <br>

        <label>LAST NAME </label>
        <input type="text" name="lname" maxlength="30" placeholder=" " required> <br> <br>

        <label>DATE OF BIRTH </label>

        <select name="Day">
            <option selected>Day</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
            <option value="6">6</option>
            <option value="7">7</option>
            <option value="8">8</option>
            <option value="9">9</option>
            <option value="10">10</option>
            <option value="11">11</option>
            <option value="12">12</option>
            <option value="13">13</option>
            <option value="14">14</option>
            <option value="15">15</option>
            <option value="16">16</option>
            <option value="17">17</option>
            <option value="18">18</option>
            <option value="19">19</option>
            <option value="20">20</option>
            <option value="21">21</option>
            <option value="22">22</option>
            <option value="23">23</option>
            <option value="24">24</option>
            <option value="25">25</option>
            <option value="26">26</option>
            <option value="27">27</option>
            <option value="28">28</option>
            <option value="29">29</option>
            <option value="30">30</option>
            <option value="31">31</option>



        </select>

        <select name="month" placeholder="Month">
            <option selected>Month</option>
            <option value="January">January</option>
            <option value="Febuary">Febuary</option>
            <option value="March">March</option>
            <option value="April">April</option>
            <option value="May">May</option>
            <option value="June">June</option>
            <option value="July">July</option>
            <option value="August">August</option>
            <option value="September">September</option>
            <option value="October">October</option>
            <option value="November">November</option>
            <option value="December">December</option>
        </select>

        <select name="Year">
            <option selected>Year</option>
            <option value="2000">2000</option>
            <option value="2001">2001</option>
            <option value="2002">2002</option>
            <option value="2003">2003</option>
            <option value="2004">2004</option>
            <option value="2005">2005</option>
            <option value="2006">2006</option>

        </select>

        <br><br>

        <label>EMAIL ID </label>
        <input type="text" name="email" required>
        <br><br>

        <label>MOBILE NUMBER </label>
        <input type="text" name="num" maxlength="10" required>
        <label>(10-digit number)</label>
        <br><br>

        <label>GENDER</label>
        <input type="radio" value="male">
        <label>Male</label> &nbsp;
        <input type="radio" value="female">
        <label>Female</label>
        <br><br>

        <label>MUNICIPALITY</label>
        <select name="municipality">
            <Option selected></Option>
            <option value="Bangued">Bangued</option>
            <option value="Boliney">Boliney</option>
            <option value="Bucay">Bucay</option>
            <option value="Bucloc">Bucloc</option>
            <option value="Daguioman">Daguioman</option>
            <option value="Danglas">Danglas</option>
            <option value="Dolores">Dolores</option>
            <option value="La Paz">La Paz</option>
            <option value="Lacub">Lacub</option>
            <option value="Lagangilang">Lagangilang</option>
            <option value="Lagayan">Lagayan</option>
            <option value="Langiden">Langiden</option>
            <option value="Licuan-Baay (Baay-Licuan)">Licuan-Baay(Baay-Licuan)</option>
            <option value="Luba">Luba</option>
            <option value="Malibcong">Malibcong</option>
            <option value="Manabo">Manabo</option>
            <option value="Peñarrubia">Peñarrubia</option>
            <option value="Pidigan">Pidigan</option>
            <option value="Pilar">Pillar</option>
            <option value="Sallapadan">Sallapadan</option>
            <option value="San Isidro">San Isidro</option>
            <option value="San Juan">San Juan</option>
            <option value="San Quintin">San Quintin</option>
            <option value="Tayum">Tayum</option>
            <option value="Tineg">Tineg</option>
            <option value="Tubo">Tubo</option>
            <option value="Villaviciosa">Villaviciosa</option>
        </select>
        <br><br>

        <label>PIN CODE </label>
        <input type="text" name="pincode" maxlength="6" required>
        <label>(6-digit namuber)</label>
        <br><br>

        <label>COUNTRY</label>
        <input type="text" name="country" maxlength="16" required>
        <br><br>

        <label>HOBBIES</label>
        <input type="radio" value="drawing">
        <label>Drawing</label> &nbsp;
        <input type="radio" value="singing">
        <label>Singing</label> &nbsp;
        <input type="radio" value="Sketching">
        <label>Sketching</label> &nbsp;
        <input type="radio" value="others">
        <label>Others</label>
        <input type="text" maxlength="32">

        <br><br>

        <label>COURSES</label> <br>
        <label>APPLIED FOR</label>

        <input type="radio" value="bscs">
        <label>BSCS</label>

        <input type="radio" value="bsit">
        <label>BSIT</label>

        <br><br>

        <button type="submit" name="register">REGISTER</button>
        <button type="reset" name="reset">RESET</button>

        
    </form>
</body>
</html>
